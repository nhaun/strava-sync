[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-sync"
version = "0.1.0"
description = "Periodically download new Strava activities (original FIT / GPX) into a folder, e.g. Dreeve's watch/ directory."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strava-sync = "strava_sync.main:main"

[tool.setuptools]
packages = ["strava_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
